<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="t d" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <title id="t">B-screw: the gap between the guide pulley and the largest cog</title>
  <desc id="d">Side view, schematic. The guide pulley sits just below the largest cog. Tightening the B-screw moves the pulley away from the cog and makes the gap bigger; loosening it moves the pulley closer.</desc>
  <style>.cog{fill:none;stroke:#8a8f98;stroke-width:10;stroke-dasharray:6 4}.pul{fill:none;stroke:#1d1f23;stroke-width:8;stroke-dasharray:4 3}
    .gap{stroke:#a3391d;stroke-width:2}.lab{font-size:15px;font-weight:700;fill:#1d1f23}.note{font-size:12.5px;fill:#4a4f57}.acc{fill:#a3391d;font-size:13px;font-weight:700}</style>
  <text class="lab" x="20" y="26">B-screw sets the gap, not the gear</text>
  <text class="note" x="20" y="44">Side view, schematic, not to scale.</text>
  <circle class="cog" cx="200" cy="140" r="80"/>
  <text class="note" x="168" y="145">largest cog</text>
  <circle class="pul" cx="200" cy="252" r="20"/>
  <text class="note" x="230" y="262">guide pulley</text>
  <path class="gap" d="M150 225 h100" stroke-dasharray="3 3"/>
  <path class="gap" d="M150 232 h100" stroke-dasharray="3 3"/>
  <text class="acc" x="258" y="234">the gap</text>
  <g transform="translate(360 70)">
    <rect x="0" y="0" width="260" height="150" rx="10" fill="#f2eef9" stroke="#6b4fa0"/>
    <text x="16" y="30" class="lab" fill="#6b4fa0">Tighten B = Bigger gap</text>
    <text x="16" y="58" class="note">Screw the B-screw in (clockwise):</text>
    <text x="16" y="76" class="note">the pulley moves away from the cog.</text>
    <text x="16" y="104" class="note">Screw it out (anticlockwise):</text>
    <text x="16" y="122" class="note">the pulley moves closer to the cog.</text>
  </g>
</svg>

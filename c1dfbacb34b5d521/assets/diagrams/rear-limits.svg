<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-labelledby="t d" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <title id="t">Rear derailleur limit screws: where the guide pulley must sit</title>
  <desc id="d">Two panels viewed from behind the bike. Left: high limit, the centre of the guide pulley lines up with the outer face of the smallest cog. Right: low limit, the centre of the guide pulley lines up with the centre of the largest cog.</desc>
  <style>
    .cog{fill:#8a8f98}.cog.on{fill:#a3391d}.pul{fill:#1d1f23}.chain{stroke:#1d1f23;stroke-width:3}
    .guide{stroke:#a3391d;stroke-width:1.5;stroke-dasharray:5 4}.lab{font-size:15px;font-weight:700;fill:#1d1f23}
    .note{font-size:12.5px;fill:#4a4f57}.ax{stroke:#c9c2b4;stroke-width:2}
  </style>
  <!-- Panel A: high limit -->
  <g>
    <text class="lab" x="20" y="26">H screw (high limit)</text>
    <text class="note" x="20" y="44">Viewed from behind. Wheel to the left.</text>
    <line class="ax" x1="20" y1="140" x2="300" y2="140"/>
    <rect class="cog" x="60"  y="60"  width="6" height="160" rx="2"/>
    <rect class="cog" x="82"  y="70"  width="6" height="140" rx="2"/>
    <rect class="cog" x="104" y="80"  width="6" height="120" rx="2"/>
    <rect class="cog" x="126" y="88"  width="6" height="104" rx="2"/>
    <rect class="cog" x="148" y="95"  width="6" height="90"  rx="2"/>
    <rect class="cog" x="170" y="101" width="6" height="78"  rx="2"/>
    <rect class="cog" x="192" y="106" width="6" height="68"  rx="2"/>
    <rect class="cog on" x="214" y="111" width="6" height="58" rx="2"/>
    <line class="chain" x1="217" y1="169" x2="220" y2="228"/>
    <rect class="pul" x="216" y="228" width="8" height="48" rx="3"/>
    <line class="guide" x1="220" y1="96" x2="220" y2="300"/>
    <text class="note" x="232" y="250">guide pulley</text>
    <text class="note" x="232" y="105">outer face of</text>
    <text class="note" x="232" y="120">smallest cog</text>
    <text class="note" x="20" y="318">Pulley centre under the smallest cog's outer face.</text>
  </g>
  <!-- Panel B: low limit -->
  <g transform="translate(320 0)">
    <text class="lab" x="20" y="26">L screw (low limit)</text>
    <text class="note" x="20" y="44">Viewed from behind. Wheel to the left.</text>
    <line class="ax" x1="20" y1="140" x2="300" y2="140"/>
    <rect class="cog on" x="60" y="60" width="6" height="160" rx="2"/>
    <rect class="cog" x="82"  y="70"  width="6" height="140" rx="2"/>
    <rect class="cog" x="104" y="80"  width="6" height="120" rx="2"/>
    <rect class="cog" x="126" y="88"  width="6" height="104" rx="2"/>
    <rect class="cog" x="148" y="95"  width="6" height="90"  rx="2"/>
    <rect class="cog" x="170" y="101" width="6" height="78"  rx="2"/>
    <rect class="cog" x="192" y="106" width="6" height="68"  rx="2"/>
    <rect class="cog" x="214" y="111" width="6" height="58"  rx="2"/>
    <line class="chain" x1="63" y1="220" x2="63" y2="240"/>
    <rect class="pul" x="59" y="240" width="8" height="48" rx="3"/>
    <line class="guide" x1="63" y1="50" x2="63" y2="300"/>
    <text class="note" x="76" y="262">guide pulley</text>
    <text class="note" x="76" y="62">centre of</text>
    <text class="note" x="76" y="77">largest cog</text>
    <text class="note" x="20" y="318">Pulley centre under the largest cog's centre.</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" role="img" aria-labelledby="t d" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <title id="t">Barrel adjuster: unscrew to climb</title>
  <desc id="d">The housing sits in the barrel adjuster, which screws into the derailleur or shifter. Unscrewing the barrel pushes the housing further away, which tightens the inner cable and moves the chain towards the bigger cogs. Screwing it in slackens the cable and lets the chain drop towards the smaller cogs.</desc>
  <style>.body{fill:#c9c2b4}.barrel{fill:#a3391d}.housing{fill:#1d1f23}.cable{stroke:#6b6f76;stroke-width:2}
    .lab{font-size:15px;font-weight:700;fill:#1d1f23}.note{font-size:12.5px;fill:#4a4f57}.arrow{stroke:#2f6b3a;stroke-width:3;fill:none}</style>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f6b3a"/></marker></defs>
  <text class="lab" x="20" y="26">Unscrew to climb</text>
  <text class="note" x="20" y="44">Barrel adjuster, schematic.</text>
  <!-- before -->
  <rect class="body" x="380" y="80" width="200" height="50" rx="6"/>
  <text class="note" x="420" y="150">derailleur (or shifter) body</text>
  <rect class="barrel" x="320" y="88" width="70" height="34" rx="4"/>
  <rect class="housing" x="60" y="96" width="262" height="18" rx="4"/>
  <line class="cable" x1="30" y1="105" x2="600" y2="105"/>
  <text class="note" x="70" y="88">housing (outer casing)</text>
  <text class="note" x="300" y="78">barrel</text>
  <path class="arrow" marker-end="url(#ah)" d="M300 160 h-110"/>
  <text class="note" x="20" y="192">Unscrew: barrel comes out,</text>
  <text class="note" x="20" y="210">housing pushed back,</text>
  <text class="note" x="20" y="228">cable tighter: chain climbs</text>
  <text class="note" x="20" y="246">to a bigger cog.</text>
  <path class="arrow" marker-end="url(#ah)" d="M400 160 h110"/>
  <text class="note" x="400" y="192">Screw in: barrel goes in,</text>
  <text class="note" x="400" y="210">cable slacker: chain drops</text>
  <text class="note" x="400" y="228">to a smaller cog.</text>
</svg>

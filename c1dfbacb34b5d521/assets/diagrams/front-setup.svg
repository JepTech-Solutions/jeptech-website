<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="t d" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <title id="t">Front derailleur: height and angle</title>
  <desc id="d">Left: side view. The lower edge of the outer cage plate sits 1 to 3 millimetres above the tips of the largest chainring's teeth. Right: view from above. The flat section of the outer cage plate runs parallel to the chainring.</desc>
  <style>.ring{fill:none;stroke:#8a8f98;stroke-width:3}.teeth{fill:none;stroke:#8a8f98;stroke-width:9;stroke-dasharray:4 5}
    .cage{fill:#1d1f23}.gap{stroke:#a3391d;stroke-width:2}.lab{font-size:15px;font-weight:700;fill:#1d1f23}.note{font-size:12.5px;fill:#4a4f57}.acc{fill:#a3391d;font-size:13px;font-weight:700}</style>
  <text class="lab" x="20" y="26">1 Height</text>
  <text class="note" x="20" y="44">Side view, drive side.</text>
  <path class="teeth" d="M40 225 A240 240 0 0 1 320 225"/>
  <text class="note" x="70" y="262">largest chainring (teeth tips)</text>
  <path d="M110 167.5 A262 262 0 0 1 260 170.5" fill="none" stroke="#1d1f23" stroke-width="8"/>
  <text class="note" x="120" y="140">outer cage plate</text>
  <line class="gap" x1="190" y1="162" x2="190" y2="176"/><line class="gap" x1="184" y1="162" x2="196" y2="162"/><line class="gap" x1="184" y1="176" x2="196" y2="176"/>
  <line class="gap" x1="196" y1="169" x2="280" y2="128" stroke-width="1"/><text class="acc" x="284" y="128">1–3 mm</text>
  <g transform="translate(340 0)">
    <text class="lab" x="20" y="26">2 Angle</text>
    <text class="note" x="20" y="44">From above.</text>
    <rect x="30" y="160" width="250" height="8" rx="3" fill="#8a8f98"/>
    <text class="note" x="30" y="192">largest chainring, seen edge-on</text>
    <rect x="80" y="134" width="150" height="7" rx="3" fill="#1d1f23"/>
    <text class="note" x="80" y="124">outer cage plate, flat section</text>
    <text class="acc" x="30" y="236">Parallel: same gap at front and back.</text>
    <text class="note" x="30" y="256">Check: hold a hex key flat against the</text>
    <text class="note" x="30" y="274">ring and sight it against the plate.</text>
  </g>
</svg>
